<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Jevy Graph</title>
    <link rel="stylesheet" href="styles.css?v=15" />
  </head>
  <body>
    <main>
      <label class="drop" id="drop" for="file-input">
        <input id="file-input" type="file" accept=".pdf,.txt,.md,.csv,.docx" />
        <span class="plus" aria-hidden="true"></span>
        <strong>Drop document</strong>
        <small id="drop-detail">PDF, TXT, DOCX</small>
        <span class="upload-timer" aria-live="off" title="Upload to backend completion, excluding final graph layout">
          Elapsed <span id="elapsed-time">0.0s</span>
        </span>
      </label>

      <section class="output" aria-label="Generated knowledge graph">
        <div id="cy"></div>
        <dl class="graph-stats" aria-label="Graph statistics" aria-live="polite">
          <div>
            <dt>Edges</dt>
            <dd id="edge-count">0</dd>
          </div>
          <div>
            <dt>Nodes</dt>
            <dd id="node-count">0</dd>
          </div>
        </dl>
        <footer>
          <div class="detail-row">
            <h2 id="source-label">Source text</h2>
            <p id="source-text" aria-labelledby="source-label">Hover over an edge or leaf node to see its source sentence.</p>
          </div>
          <div class="detail-row">
            <h2 id="triple-label">Triple</h2>
            <p id="triple-text" aria-labelledby="triple-label">—</p>
          </div>
        </footer>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-layout-utilities@1.1.1/cytoscape-layout-utilities.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
    <script src="app.js?v=25"></script>
  </body>
</html>
