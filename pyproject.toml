[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jevy-graph"
version = "0.1.0"
description = "A small, source-grounded text-to-RDF compiler verified by Jev."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sai Venna" }]
keywords = ["knowledge-graph", "rdf", "information-extraction", "jev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/saivivekvenna/jevy-graph"
Issues = "https://github.com/saivivekvenna/jevy-graph/issues"
Source = "https://github.com/saivivekvenna/jevy-graph"
Changelog = "https://github.com/saivivekvenna/jevy-graph/blob/main/CHANGELOG.md"

[project.scripts]
jevy-graph = "jevy_graph.cli:main"
jevy-graph-demo = "jevy_graph.demo_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevy_graph"]
force-include = { "demo" = "jevy_graph/demo" }

[tool.hatch.build.targets.sdist]
exclude = ["/assets"]
